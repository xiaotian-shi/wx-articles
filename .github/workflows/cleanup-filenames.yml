name: Cleanup article filenames

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '.github/workflows/cleanup-filenames.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, 'cleanup article filenames')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove trailing numeric suffixes
        shell: bash
        run: |
          shopt -s nullglob
          changed=0
          for f in *_*.md; do
            if [[ "$f" =~ _[0-9]{3}\.md$ ]]; then
              base="${f%_[0-9][0-9][0-9].md}.md"
              if [[ -e "$base" ]]; then
                git rm -- "$f"
              else
                git mv -- "$f" "$base"
              fi
              changed=1
            fi
          done

          # Remove this one-time helper after the cleanup.
          rm -f .github/workflows/cleanup-filenames.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [[ "$changed" -eq 1 ]]; then
            git commit -m "cleanup article filenames"
            git push origin HEAD:main
          else
            git commit -m "cleanup article filenames" --allow-empty
            git push origin HEAD:main
          fi
