name: Unify article commit display

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '.github/workflows/unify-article-commits.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Touch all articles
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.md; do
            if [ "$(basename "$f")" != "README.md" ]; then
              printf '\n' >> "$f"
            fi
          done

      - name: Commit all article updates once
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git rm -f .github/workflows/unify-article-commits.yml
          git commit -m "统一更新全部文章显示"
          git push
