name: Generate articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate 600 Markdown articles
        run: python tools/generate_articles.py
      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md'
          git status --short
          if git diff --cached --quiet; then
            echo "No article changes"
          else
            git commit -m "生成600篇微信账号主题文章"
            git push
          fi
