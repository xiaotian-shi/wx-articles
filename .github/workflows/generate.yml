name: Generate articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove old generated articles
        run: |
          find . -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -delete
      - name: Generate 600 Markdown articles with keywords
        run: python tools/generate_articles.py --replace-placeholder
      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md'
          git status --short
          if git diff --cached --quiet; then
            echo "No article changes"
          else
            git commit -m "按192个关键词生成600篇文章"
            git push
          fi
