name: Diversify article content

on:
  push:
    paths:
      - '*.md'
      - '.github/workflows/diversify-content.yml'

permissions:
  contents: write

jobs:
  diversify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diversify article structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          snippets = [
            '从技术实现角度看，缓存命中、网络延迟和页面渲染并不是同一个环节，排查问题时最好分开观察。',
            '浏览器处理页面时会经历解析、构建结构和绘制等阶段，因此同一段内容在不同设备上的表现可能并不完全一致。',
            '如果把系统看成一条流水线，那么日志就像沿途留下的路标。信息越完整，定位异常时越容易缩小范围。',
            '数据库索引适合解决特定查询场景，但索引越多并不代表速度一定越快，写入成本同样需要考虑。',
            '接口出现偶发超时时，可以从请求耗时、服务端处理时间以及网络传输三个方向分别记录数据。',
            '字符编码属于容易被忽略的基础问题。文本在不同系统之间流转时，编码不一致可能造成看似毫无规律的显示异常。',
            '版本控制的价值不只是保存历史版本，还能帮助开发者明确一次修改究竟改变了哪些内容。',
            '在前端页面中，图片尺寸、字体加载和脚本执行顺序都可能影响最终的页面完成时间。',
            'HTTP缓存可以减少重复请求，但缓存策略需要和内容更新频率配合，否则旧数据可能停留过久。',
            '一个看起来简单的按钮，背后可能涉及事件监听、接口请求、状态更新和重新渲染多个步骤。',
            '系统时间不准确时，一些依赖时间戳的日志、缓存和鉴权逻辑也可能出现令人困惑的结果。',
            '文件名只是资源的一部分，真正管理大量内容时，还需要考虑目录结构、命名规则和检索方式。',
            '在自动化任务中，幂等性很重要。同一个任务重复执行时，最好不会产生无法恢复的重复结果。',
            '网络请求失败不一定意味着服务完全不可用，也可能只是瞬时拥塞、DNS解析或连接建立过程出现问题。',
            '移动端设备的屏幕尺寸差异较大，固定像素布局在某些场景下容易产生溢出或换行问题。',
            '日志中的时间、请求标识和错误级别通常比一大段没有上下文的报错文字更有分析价值。',
            '当一个页面内容很多时，合理拆分信息层级通常比单纯增加文字数量更容易让人找到重点。',
            '代码注释的主要作用是解释为什么这样做，而不是重复描述代码本身已经表达出来的内容。',
            '配置文件发生变化后，服务是否真正重新加载也是排查问题时容易遗漏的一步。',
            '数据备份需要考虑恢复过程。只有能够实际恢复出来的备份，才真正具备可用价值。',
            '搜索功能通常包含分词、匹配、排序等环节，因此搜索结果并不只是简单地查找一段字符串。',
            '同一个功能在开发环境和生产环境中的表现可能不同，环境变量和依赖版本是常见原因之一。',
            '浏览器缓存、服务器缓存和应用内部缓存可能同时存在，分析数据是否最新时需要明确缓存层级。',
            '如果一个操作需要经过多个服务，最好保留统一的请求标识，这样日志之间才能更容易串联起来。',
            '数据结构决定了很多操作的成本。选择合适的数据结构，有时比单纯优化某一行代码更加有效。',
            '页面加载速度并不只由服务器决定，网络状况、资源体积和终端性能也会共同影响体验。',
            '程序运行出现异常时，先复现问题再记录现象，通常比凭感觉直接修改代码更可靠。',
            '自动化脚本应尽量提供清晰的输出信息，否则任务虽然执行成功，后续检查仍然会比较困难。',
            '接口参数的命名保持一致，可以降低前后端沟通成本，也方便后续维护和测试。',
            '当内容需要批量生成时，统一模板能够提高效率，但模板过于固定又容易造成表达方式趋同。',
            '文本排版本身也是信息结构的一部分，标题、段落和留白都会影响阅读节奏。',
            '一个稳定的系统通常不是完全没有错误，而是发生错误后能够快速发现、定位并恢复。',
            '浏览器开发者工具可以观察网络请求和页面结构，很多表面上的显示问题其实都能从这些信息中找到线索。',
            '数据库查询慢的时候，可以先看实际执行计划，而不是直接增加硬件或盲目添加索引。',
            '当页面需要展示大量数据时，分页、懒加载和虚拟列表都是常见的处理思路。',
            '软件升级除了关注新功能，还应留意依赖变化、配置变化以及旧数据是否仍然兼容。',
            '对于批处理任务，适当设置失败重试次数可以提高成功率，但无限重试反而可能造成资源持续消耗。',
            '一个好的错误提示应该尽量说明发生了什么以及下一步可以检查什么，而不是只显示一个数字。',
            '在不同操作系统之间迁移文件时，路径格式、换行符和字符编码都是可能出现差异的地方。',
            '网页中的标题层级不仅影响视觉效果，也有助于读者快速理解文章的组织方式。',
            '如果内容经常变化，可以把稳定部分和变化部分拆开管理，这样更新时不需要反复修改整份文件。',
            '程序的可维护性往往来自许多小习惯，例如统一命名、合理拆分函数以及保留必要的测试。',
            '当两个系统需要交换数据时，明确字段类型和缺省值，可以减少很多边界情况下的兼容问题。',
            '图片、脚本和样式表都属于页面资源，资源数量过多时，请求调度本身也会成为性能因素。',
            '在调试过程中记录关键变量的变化轨迹，通常比只看最终结果更容易找到问题发生的位置。',
            '如果一个规则需要大量例外才能成立，往往说明原来的规则设计还可以继续简化。',
            '内容管理系统通常会把文章、分类、标签和页面模板分开处理，这样后期调整展示形式会更方便。',
            '静态页面虽然结构简单，但同样可以通过合理的缓存和资源组织获得不错的访问速度。',
            '不同字体的实际占用空间并不一样，因此文字换行问题有时并不是容器宽度造成的。',
            '在批量处理文件时，先统计输入数量和输出数量，可以避免因为遗漏文件而误以为任务已经完成。',
            '程序中的随机行为如果没有固定种子，重复运行时可能得到不同结果；这在调试时尤其需要注意。',
            '一个目录里文件很多时，按用途、日期或主题建立稳定的命名习惯，会比单纯依赖搜索更加直观。',
            '缓存失效策略和数据一致性经常需要同时考虑，单独优化其中一项可能带来新的问题。',
            '当一个页面包含多个独立模块时，模块之间减少不必要的耦合，通常有利于后续修改。',
            '测试不一定需要覆盖所有代码行，更重要的是覆盖容易出错的边界条件和核心流程。',
            '对于长期运行的任务，资源释放同样重要，文件句柄、网络连接和内存都需要避免持续累积。',
            '网络环境发生变化时，原本正常的请求也可能出现新的延迟，因此性能观察最好保留一段时间的数据。',
            '如果一个配置项只在少数场景使用，可以明确它的默认值和适用范围，减少误配置的机会。',
            '内容生成与页面展示是两个不同层次的问题，前者关注文本，后者还要考虑HTML结构和浏览器行为。',
            '一个小型项目也可以保留简单的变更记录，这能帮助后续快速回忆某次调整的原因。',
            '当文章结构比较固定时，偶尔调整信息顺序和段落长短，可以让阅读节奏更加自然。',
            '软件系统中的很多问题并非来自单个组件，而是来自组件之间连接方式的细节。',
            '对于批量文本，保留原始版本通常比直接覆盖更加稳妥，这样出现意外时还有回退空间。',
            '页面标题、正文标题和关键词之间保持基本一致，有助于读者理解页面主题，但不必让每个段落使用相同句式。',
            '有些技术概念看起来距离日常内容很远，例如DNS、索引和渲染流程，但它们最终都会影响用户看到的结果。',
            '当一个问题无法马上解释时，先把现象拆成几个可以验证的小问题，通常更容易继续推进。'
          ]

          prefixes = [
            '顺带记录一个技术层面的观察：',
            '从另一个角度看，这里还可以想到：',
            '如果把这个问题放到软件工程里，比较有意思的一点是：',
            '另外补充一个容易被忽略的小细节：',
            '换个完全不同的技术视角来看：',
            '这里插入一个与主题不完全相关的技术笔记：',
            '再往底层想一步，会发现：',
            '作为补充，可以记下这样一个工程经验：'
          ]

          endings = [
            '这些内容不改变前文的核心信息，只是补充一些不同角度的阅读材料。',
            '把这些细节单独拆出来观察，通常更容易发现不同场景之间的差别。',
            '实际项目中是否采用这种方式，还需要结合具体环境判断。',
            '这类细节看似零散，但在长期维护中经常会碰到。',
            '这里只作为技术层面的延伸记录，不代表所有场景都需要这样处理。',
            '从内容组织角度看，这也能让整篇文章不至于一直保持同一种节奏。'
          ]

          for p in Path('.').glob('*.md'):
            if p.name == 'README.md':
              continue
            text = p.read_text(encoding='utf-8')
            marker = '<!-- DIVERSIFIED-CONTENT -->'
            if marker in text:
              continue
            seed = int(hashlib.sha256(p.name.encode('utf-8')).hexdigest()[:16], 16)
            idxs = []
            n = len(snippets)
            x = seed
            for _ in range(4):
              x = (x * 6364136223846793005 + 1442695040888963407) % (2**64)
              idx = x % n
              if idx not in idxs:
                idxs.append(idx)
            prefix = prefixes[seed % len(prefixes)]
            ending = endings[(seed >> 8) % len(endings)]
            title = [
              '技术延伸笔记', '随手记录', '补充观察', '另外想到的一点',
              '换个角度看看', '小型技术札记', '阅读时的旁支', '工程细节补充'
            ][(seed >> 16) % 8]
            block = '\n\n' + marker + '\n\n<h2>' + title + '</h2>\n'
            for i, idx in enumerate(idxs):
              block += '<p>' + prefix + snippets[idx] + '</p>\n'
              if i == 1:
                block += '<p>' + snippets[(idxs[0] + idxs[1] + seed) % n] + '</p>\n'
            block += '<p>' + ending + '</p>\n'

            # Insert before the final keyword/footer area when present; otherwise append.
            m = re.search(r'\n<hr>\s*\n<p><code>关键词：', text)
            if m:
              text = text[:m.start()] + block + text[m.start():]
            else:
              text = text.rstrip() + block + '\n'
            p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "No article changes"
          else
            git commit -m "diversify article content"
            git push
          fi
          rm -f .github/workflows/diversify-content.yml
          git add .github/workflows/diversify-content.yml
          if ! git diff --cached --quiet; then
            git commit -m "remove one-time diversification workflow"
            git push
          fi
