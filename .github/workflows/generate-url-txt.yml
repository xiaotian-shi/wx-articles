name: Generate article URL list

on:
  push:
    paths:
      - '.github/workflows/generate-url-txt.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate urls.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote

          repo = 'https://github.com/xiaotian-shi/wx-articles/blob/main/'
          files = sorted(
              p for p in Path('.').glob('*.md')
              if p.name != 'README.md'
          )
          urls = [repo + quote(p.name, safe='') for p in files]
          Path('urls.txt').write_text('\n'.join(urls) + ('\n' if urls else ''), encoding='utf-8')
          print(f'Generated {len(urls)} article URLs')
          PY
      - name: Commit urls.txt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urls.txt
          git commit -m '生成文章URL列表' || echo 'No changes'
          git push
